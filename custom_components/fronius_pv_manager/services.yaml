debug_remote_acquire:
  name: '[Development test] Acquire remote control'
  description: Temporary hardware-test helper; removed before stable v0.3.0. Uses
    the fixed debug_test owner and the normal validated remote API.
  fields:
    device_id:
      name: Modbus device ID
      description: Modbus unit ID (1–247), not a Home Assistant device registry ID.
      required: true
      selector:
        number:
          min: 1
          max: 247
          step: 1
          mode: box
    config_entry_id:
      name: Config entry ID
      description: Required if multiple loaded endpoints share this Modbus device
        ID.
      selector:
        text: {}
    minimum_charge_power:
      name: Minimum charge power
      description: Whole watts. Supply all four fields together; acquire may omit
        all four to use saved settings.
      required: false
      selector:
        number:
          min: 0
          step: 1
          mode: box
          unit_of_measurement: W
    maximum_charge_power:
      name: Maximum charge power
      description: Whole watts. Supply all four fields together; acquire may omit
        all four to use saved settings.
      required: false
      selector:
        number:
          min: 0
          step: 1
          mode: box
          unit_of_measurement: W
    minimum_discharge_power:
      name: Minimum discharge power
      description: Whole watts. Supply all four fields together; acquire may omit
        all four to use saved settings.
      required: false
      selector:
        number:
          min: 0
          step: 1
          mode: box
          unit_of_measurement: W
    maximum_discharge_power:
      name: Maximum discharge power
      description: Whole watts. Supply all four fields together; acquire may omit
